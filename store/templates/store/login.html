{% extends 'store/base.html' %}
{% block title %}Login | ShopEase{% endblock %}
{% block content %}
<div class="auth-card"><h1 class="h3 mb-4">Welcome back</h1>
{% if form.errors %}<div class="alert alert-danger">Username or password is incorrect. Please try again.</div>{% endif %}
<form method="post">{% csrf_token %}
<div class="mb-3"><label class="form-label" for="id_username">Username</label><input class="form-control" type="text" name="username" id="id_username" autocomplete="username" required></div>
<div class="mb-4"><label class="form-label" for="id_password">Password</label><input class="form-control" type="password" name="password" id="id_password" autocomplete="current-password" required></div>
<button class="btn btn-dark w-100">Login</button></form>
<p class="mt-3 mb-0 text-center">New here? <a href="{% url 'register' %}">Create an account</a></p></div>
{% endblock %}
